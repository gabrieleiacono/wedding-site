<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solo i fatti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root { --ink: #1A1714; --paper: #FBF8F0; --accent: #B6402A; --dim: #5E544A; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 'IBM Plex Sans', sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font: 700 13px 'IBM Plex Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 32px 0 8px; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
  dt { font-weight: 600; } dd { margin: 0; }
  .lead { color: var(--dim); margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main id="facts"><p>Caricamento…</p></main>
<script type="module">
  import { WEDDING, PROGRAMME, TRAVEL, STAY, DRESS, FAQ } from './src/content.js';
  const e = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const dl = (rows) => `<dl>${rows.map(([a, b]) => `<dt>${e(a)}</dt><dd>${e(b)}</dd>`).join('')}</dl>`;
  document.getElementById('facts').innerHTML = `
    <h1>${e(WEDDING.names)}</h1>
    <p class="lead">${e(WEDDING.dateLong)} · ${e(WEDDING.villa)}, ${e(WEDDING.address)}</p>
    <p><a href="index.html">← Torna allo studio</a></p>
    <h2>Il programma</h2>${dl(PROGRAMME.saturday)}<p><b>Domenica</b></p>${dl(PROGRAMME.sunday)}
    <h2>Come arrivare</h2>${dl(TRAVEL)}
    <h2>Dove dormire</h2>${dl(STAY.hotels)}<p>Codice sconto: <b>${e(STAY.code)}</b> · prenotate entro il ${e(STAY.bookBy)}.<br>Navetta: ${e(STAY.shuttle)}</p>
    <h2>Dress code</h2><p>${e(DRESS.line)}</p>${dl(DRESS.rows)}<p>${e(DRESS.tip)}</p>
    <h2>Rispondi</h2><p>Si risponde con la macchina da scrivere nello <a href="index.html?focus=typewriter">studio</a>, entro il ${e(WEDDING.rsvpBy)}.</p>
    <h2>Domande frequenti</h2>${dl(FAQ)}
    <p>Altre domande? ${e(WEDDING.contact)}</p>`;
</script>
</body>
</html>
