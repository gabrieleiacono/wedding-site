<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabriele &amp; Paola · Solo i fatti</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root { --ink: #1A1714; --paper: #FBF8F0; --accent: #B6402A; --dim: #5E544A; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 'IBM Plex Sans', sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  h2 { font: 700 13px 'IBM Plex Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 32px 0 8px; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
  dt { font-weight: 600; } dd { margin: 0; }
  .lead { color: var(--dim); margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main id="facts"><p>Caricamento…</p></main>
<script type="module">
  import { WEDDING, PROGRAMME, TRAVEL, WEATHER, DRESS, RSVP, FAQ } from './src/content.js';
  const e = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const dl = (rows) => `<dl>${rows.map(([a, b]) => `<dt>${e(a)}</dt><dd>${e(b)}</dd>`).join('')}</dl>`;
  const ps = (list) => list.map((t) => `<p>${e(t)}</p>`).join('');
  const sec = (s) => `<h2>${e(s.title)}</h2>${ps(s.text)}`;
  document.getElementById('facts').innerHTML = `
    <h1>${e(WEDDING.names)}</h1>
    <p class="lead">${e(WEDDING.dateLong)} · ${e(WEDDING.villa)}, ${e(WEDDING.address)}</p>
    <p><a href="index.html">← Torna allo studio</a></p>
    <h2>${e(PROGRAMME.title)}</h2><p><b>${e(PROGRAMME.day)}</b></p>${dl(PROGRAMME.rows)}${ps(PROGRAMME.text)}
    ${sec(TRAVEL)}
    ${sec(WEATHER)}
    ${sec(DRESS)}
    <h2>${e(RSVP.title)}</h2><p>Potete confermarci la vostra presenza, entro il ${e(WEDDING.rsvpBy)}, con la macchina da scrivere nello <a href="index.html?focus=typewriter">studio</a>.</p>
    <h2>Domande frequenti</h2>${FAQ.map(([q, a]) => `<p><b>${e(q)}</b></p>${ps(a)}`).join('')}`;
</script>
</body>
</html>
