<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabriele &amp; Paola · Lo Scrittoio con Vista</title>
<meta name="description" content="Gabriele &amp; Paola si sposano sabato 29 maggio 2027 alla Cascina Carretto, Erbusco.">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Caveat:wght@500;700&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<canvas id="scene" aria-label="Uno studio italiano degli anni '90 al tramonto, disegnato a penna. Trascina per girarti."></canvas>

<div id="hud">
  <div id="title" class="pill"></div>
  <nav id="compass" class="pill" aria-label="Pareti della stanza">
    <button data-turn="1" aria-label="Girati a sinistra">‹</button>
    <span id="wall-name">A · La scrivania</span>
    <button data-turn="-1" aria-label="Girati a destra">›</button>
  </nav>
  <div id="hotspots"></div>
  <div id="hint" class="pill">Trascina per girarti · clicca sugli oggetti</div>
  <div id="corner">
    <a id="facts" class="pill btn" href="facts.html">Solo i fatti</a>
    <button id="audio" class="pill btn round" aria-label="Audio acceso" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"></path><path class="wave" d="M19 5a10 10 0 0 1 0 14"></path></svg>
    </button>
  </div>
  <button id="back" class="pill btn" hidden>← Torna alla stanza</button>
  <div id="help" class="pill" hidden></div>
</div>

<div id="remote" hidden aria-label="Telecomando">
  <div class="disp-row"><button type="button" data-sub="-1" aria-label="Sottopagina precedente">◀</button><div id="remote-display">P100</div><button type="button" data-sub="1" aria-label="Sottopagina successiva">▶</button></div>
  <div class="digits"></div>
  <div class="fastext"></div>
  <div class="av-keys" hidden><button data-av="-1" aria-label="Su">▲</button><button data-av="1" aria-label="Giù">▼</button></div>
</div>

<div id="overlay" hidden role="dialog" aria-modal="true">
  <div id="overlay-card"></div>
  <button id="overlay-close" class="pill btn round" aria-label="Chiudi">✕</button>
</div>

<input id="typer" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Tastiera della macchina da scrivere">

<div id="loading"><span>Sto disegnando la stanza…</span></div>
<script>
  // If the room can't be drawn, say so on the loading screen, in words a guest can act on, with a way
  // through (try again, or the plain facts page) instead of waiting there for ever. The technical reason
  // goes underneath in small type, for whoever is asked to fix it.
  (function () {
    var failed = false;
    var box = function (lead, advice, why) {
      var l = document.getElementById('loading');
      if (!l || l.classList.contains('gone')) return null;
      l.innerHTML = '<div class="boot-msg" role="alert"><p class="lead"></p><p class="advice"></p>' +
        '<p class="acts"><button type="button" class="pill btn" data-reload>Riprova</button> <a class="pill btn" href="facts.html">Solo i fatti</a></p><p class="why"></p></div>';
      l.querySelector('.lead').textContent = lead;
      l.querySelector('.advice').textContent = advice;
      l.querySelector('.why').textContent = why || '';
      l.querySelector('[data-reload]').onclick = function () { location.reload(); };
      return l;
    };
    // on the claude.ai preview, also note what went wrong in the page's database, so it can be fixed
    // without anyone having to copy the message out by hand
    var report = function (m, stack) {
      try {
        if (!window.claude || !window.claude.use) return;
        window.claude.use('db').then(function (db) {
          if (!db) return;
          var gl2 = false; try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
          return db.collection('boot-errors').add({ at: new Date().toISOString(), message: String(m).slice(0, 500), stack: String(stack || '').slice(0, 2000),
            ua: navigator.userAgent, screen: innerWidth + 'x' + innerHeight + '@' + (window.devicePixelRatio || 1), webgl2: gl2 });
        }).catch(function () {});
      } catch (e) {}
    };
    var reports = 0, vague = true;
    var fail = function (m, stack) {
      // a later error can say more than the first one (a script element's error event carries no text)
      if (failed) {
        if (!vague || !m || m === 'errore') return;
        vague = false; if (reports++ < 3) report(m, stack);
        var w = document.querySelector('#loading .why'); if (w) w.textContent = m;
        return;
      }
      failed = true; vague = !m || m === 'errore' || /^script /.test(m);
      if (reports++ < 3) report(m, stack);
      var gl = /webgl|context/i.test(m);
      box('La stanza non si è caricata.',
        gl ? 'Questo browser in questo momento non riesce a disegnare in 3D. Chiudi del tutto il browser, riaprilo e riprova. Se non basta, prova con Chrome o Safari aggiornati.'
           : 'Riprova tra un attimo. Se succede ancora, prova con un altro browser.', m);
    };
    addEventListener('error', function (e) {
      if (e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return;
      var t = e.target && e.target !== window ? e.target : null;
      fail(String(e.message || (t ? 'script ' + (t.src || t.type || 'inline') + ' non caricato' : 'errore')), e.error && e.error.stack);
    }, true);
    addEventListener('unhandledrejection', function (e) { fail(String((e.reason && e.reason.message) || e.reason), e.reason && e.reason.stack); });
    // slow phones: after a while, offer the same ways out without giving up on the drawing
    setTimeout(function () {
      if (failed) return;
      var l = document.getElementById('loading');
      if (!l || l.classList.contains('gone')) return;
      var n = document.createElement('div'); n.className = 'boot-msg slow';
      n.innerHTML = '<p class="advice">Ci sta mettendo un po\'. Se resta ferma qui, riprova.</p><p class="acts"><button type="button" class="pill btn" data-reload>Riprova</button> <a class="pill btn" href="facts.html">Solo i fatti</a></p>';
      n.querySelector('[data-reload]').onclick = function () { location.reload(); };
      l.appendChild(n);
    }, 25000);
    // the graphics can also stop later (a phone short of memory): if they don't come back, say so
    var c = document.getElementById('scene'), lost = null;
    c.addEventListener('webglcontextlost', function () {
      lost = setTimeout(function () {
        var l = document.getElementById('loading'); if (!l) return;
        l.classList.remove('gone');
        failed = false;
        fail('WebGL context lost');
      }, 4000);
    });
    c.addEventListener('webglcontextrestored', function () { clearTimeout(lost); });
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
